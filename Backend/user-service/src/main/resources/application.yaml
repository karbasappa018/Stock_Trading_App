spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect;

  kafka:
    bootstrap-server: localhost:9092
    producer:
      key-serializer: org.apache.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.jsonserializer

server:
  port: 8081

jwt:
  secret:
    expiration:
      refresh-expiration:

management:
  endpoints:
    web:
      exposure:
        include: health,info

